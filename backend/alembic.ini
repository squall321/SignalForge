[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL 환경에서 읽는다(alembic/env.py) — 기본 DSN 은 두지 않는다(공개 리포의 옛 기본 비밀번호였다, 2026-11-27)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
