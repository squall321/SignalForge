; Standard Platform 코어 수신 설정 — 이 파일을 config.ini 로 복사해 사용합니다.
[sp]
; 공개 측이 알려 준 주소. 끝에 /api 까지 포함합니다.
base_url = {BASE}

; 발급받은 액세스 토큰(범위 core:read). 환경변수 SP_TOKEN 으로 대신할 수 있습니다.
token =

; 수신할 타입. 비우면 공개된 타입 전부입니다.
types = {TYPES}

; 결과 저장 위치(CSV · SQLite · 수신 상태).
out_dir = out

; 한 번에 받을 행 수(최대 2000), 시간 제한, 재시도 횟수.
page_size = 500
timeout_seconds = 60
retries = 3
